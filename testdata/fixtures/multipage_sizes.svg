<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="660"
   height="512"
   viewBox="0 0 660 512"
   version="1.1"
   id="svg_multipage_sizes"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#2e2e35"
     bordercolor="#666666"
     borderopacity="1.0">
    <!-- Page 1: 512x512 square at x=0 -->
    <inkscape:page x="0" y="0" width="512" height="512" id="page_large" inkscape:label="Large Artboard" />
    <!-- Page 2: 128x128 square at x=530 -->
    <inkscape:page x="530" y="0" width="128" height="128" id="page_small" inkscape:label="Small Emote" />
  </sodipodi:namedview>

  <g id="layer1" inkscape:groupmode="layer" inkscape:label="Layer 1">
    <!-- Content on Page 1 -->
    <rect x="56" y="56" width="400" height="400" rx="30" fill="#9146FF" />
    <circle cx="256" cy="256" r="120" fill="#FFFFFF" />
    <!-- Content on Page 2 -->
    <rect x="544" y="14" width="100" height="100" rx="10" fill="#FF4F9D" />
    <circle cx="594" cy="64" r="30" fill="#FFFFFF" />
  </g>

  <g id="layer2" inkscape:groupmode="layer" inkscape:label="Layer 2">
    <!-- Content on Page 1 -->
    <circle cx="256" cy="256" r="60" fill="#18181B" />
    <!-- Content on Page 2 -->
    <circle cx="594" cy="64" r="15" fill="#18181B" />
  </g>
</svg>
