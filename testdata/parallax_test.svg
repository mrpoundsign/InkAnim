<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="200"
   height="200"
   viewBox="0 0 200 200"
   version="1.1"
   id="svg_parallax_test"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Camera panning 40px right over 3 frames -->
  <path
     id="cam_track"
     inkscape:label="Camera {f: 1-3; ease: linear}"
     d="M 0,0 L 40,0" />

  <!-- Fixed background / canvas -->
  <rect width="200" height="200" fill="#000000" id="fixed_canvas" />

  <!-- Background layer (clouds/distant stars): factor 0.1 -->
  <g id="layer_bg" inkscape:groupmode="layer" inkscape:label="Background">
    <circle cx="20" cy="20" r="5" fill="#555555" />
    <path id="bg_dist" inkscape:label="Dist {factor: 0.1}" d="M 0,0 L 0,0" />
  </g>

  <!-- Midground layer (mountains/hills): depth 100 -> factor 0.5 -->
  <g id="layer_mid" inkscape:groupmode="layer" inkscape:label="Midground">
    <rect x="50" y="50" width="30" height="30" fill="#888888" />
    <path id="mid_dist" inkscape:label="Dist {depth: 100}" d="M 0,0 L 0,0" />
  </g>

  <!-- Focal plane layer: default factor 1.0 (no Dist tag) -->
  <g id="layer_focal" inkscape:groupmode="layer" inkscape:label="Focal Character">
    <rect x="100" y="100" width="20" height="20" fill="#ffffff" />
    <!-- Nested child group with local scale to verify no double-translation -->
    <g id="focal_child" inkscape:label="Child Item">
      <circle cx="110" cy="110" r="3" fill="#ff0000" />
      <path id="child_scale" inkscape:label="Scale {f: 1-3; from: 1.0; to: 2.0; pivot: center}" d="M 0,0 L 0,0" />
    </g>
  </g>

  <!-- Foreground layer: factor 1.5 -->
  <g id="layer_fg" inkscape:groupmode="layer" inkscape:label="Foreground">
    <circle cx="150" cy="150" r="10" fill="#ff00ff" />
    <path id="fg_dist" inkscape:label="Dist {factor: 1.5}" d="M 0,0 L 0,0" />
  </g>

  <!-- Static HUD layer: Dist {fixed} -->
  <g id="layer_hud" inkscape:groupmode="layer" inkscape:label="HUD Overlay">
    <rect x="5" y="5" width="40" height="15" fill="#00ffff" />
    <path id="hud_dist" inkscape:label="Dist {fixed}" d="M 0,0 L 0,0" />
  </g>
</svg>
