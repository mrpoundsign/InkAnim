<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   id="svg_inkanim_demo"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#2e2e35"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#1e1e24" />

  <!-- Frame 1: Neutral -->
  <g
     inkscape:groupmode="layer"
     id="layer_frame1"
     inkscape:label="Frame 1 - Neutral"
     style="display:inline">
    <!-- Shadow -->
    <ellipse cx="128" cy="225" rx="46" ry="12" fill="#202028" opacity="0.6" />
    <!-- Slime body -->
    <circle cx="128" cy="135" r="62" fill="#9146FF" />
    <ellipse cx="110" cy="100" rx="14" ry="8" fill="#B37DFF" opacity="0.5" />
    <!-- Eyes -->
    <circle cx="108" cy="126" r="11" fill="#FFFFFF" />
    <circle cx="110" cy="126" r="6" fill="#18181B" />
    <circle cx="148" cy="126" r="11" fill="#FFFFFF" />
    <circle cx="150" cy="126" r="6" fill="#18181B" />
    <!-- Neutral mouth -->
    <ellipse cx="128" cy="158" rx="12" ry="7" fill="#18181B" />
  </g>

  <!-- Frame 2: Jump Stretch -->
  <g
     inkscape:groupmode="layer"
     id="layer_frame2"
     inkscape:label="Frame 2 - Jump"
     style="display:none">
    <!-- Smaller Shadow during jump -->
    <ellipse cx="128" cy="230" rx="32" ry="8" fill="#202028" opacity="0.35" />
    <!-- Stretched body higher up -->
    <ellipse cx="128" cy="115" rx="54" ry="72" fill="#9146FF" />
    <ellipse cx="112" cy="75" rx="12" ry="7" fill="#B37DFF" opacity="0.5" />
    <!-- Excited Eyes -->
    <circle cx="108" cy="104" r="13" fill="#FFFFFF" />
    <circle cx="110" cy="102" r="7" fill="#18181B" />
    <circle cx="148" cy="104" r="13" fill="#FFFFFF" />
    <circle cx="150" cy="102" r="7" fill="#18181B" />
    <!-- Big Open Smile -->
    <ellipse cx="128" cy="142" rx="18" ry="14" fill="#FF4F9D" />
    <ellipse cx="128" cy="146" rx="10" ry="8" fill="#770030" />
  </g>

  <!-- Frame 3: Land Squash -->
  <g
     inkscape:groupmode="layer"
     id="layer_frame3"
     inkscape:label="Frame 3 - Land"
     style="display:none">
    <!-- Wider Shadow during landing -->
    <ellipse cx="128" cy="222" rx="60" ry="14" fill="#202028" opacity="0.75" />
    <!-- Squashed body lower down -->
    <ellipse cx="128" cy="162" rx="76" ry="46" fill="#772CE8" />
    <!-- Happy eyes (arcs) -->
    <path d="M 98 152 Q 108 140 118 152" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 138 152 Q 148 140 158 152" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Happy smile -->
    <path d="M 116 176 Q 128 188 140 176" stroke="#18181B" stroke-width="5" fill="none" stroke-linecap="round" />
  </g>
</svg>
