<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   id="svg5"
   sodipodi:docname="spline_test.svg"
   inkscape:version="1.4 (e7c3feb100, 2024-10-09)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1">
    <marker
       style="overflow:visible"
       id="ArrowWide"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       inkscape:stockid="Wide arrow"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       inkscape:isstock="true"
       inkscape:collect="always"
       preserveAspectRatio="xMidYMid">
      <path
         style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
         d="M 3,-3 0,0 3,3"
         transform="rotate(180,0.125,0)"
         sodipodi:nodetypes="ccc"
         id="path1" />
    </marker>
  </defs>
  <sodipodi:namedview
     id="namedview7"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:pageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:document-units="px"
     showgrid="false"
     inkscape:showpageshadow="2"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.0898438"
     inkscape:cx="255.54122"
     inkscape:cy="256"
     inkscape:window-width="1332"
     inkscape:window-height="803"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="g_rocket" />
  <g
     inkscape:groupmode="layer"
     id="layer1"
     inkscape:label="Layer 1">
    <!-- Group containing the object and its movement spline -->
    <g
       id="g_rocket">
      <!-- The object to move (a red square) -->
      <rect
         style="fill:#00ff00;stroke:none"
         id="rect_rocket"
         width="50"
         height="50"
         x="50"
         y="50" />
      <!-- The movement path (a curved spline) with the magic label -->
      <path
         style="fill:none;stroke:#0000ff;stroke-width:3px;stroke-linecap:butt;stroke-linejoin:miter;stroke-opacity:1;marker-end:url(#ArrowWide)"
         d="M 75,75 C 250,-50 400,200 450,450"
         id="path_motion"
         inkscape:label="Movement {f: 1-60; ease: in-out}" />
    </g>
  </g>
