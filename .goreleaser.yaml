version: 2

project_name: inkanim

before:
  hooks:
    - go mod tidy

builds:
  - id: inkanim-cli
    main: ./cmd/inkanim-cli
    binary: inkanim-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - DESIGN.md
      - LICENSE
      - testdata/character_walk.svg

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: mrpoundsign
    name: InkAnim
  draft: false
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
