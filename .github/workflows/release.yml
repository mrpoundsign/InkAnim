name: Release InkAnim

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI & Font Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev fonts-dejavu-core

      - name: Run Full Test Suite
        run: go test -v ./...

      - name: Check Go Modernization
        run: |
          diff=$(go fix -diff ./...)
          if [ -n "$diff" ]; then
            echo "Go modernization diff found:"
            echo "$diff"
            exit 1
          fi

      - name: Run golangci-lint (v2)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Validate GoReleaser Config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Verify WebAssembly Compilation
        run: |
          GOOS=js GOARCH=wasm go build -tags migrated_fynedo -o /dev/null ./cmd/inkanim

  build-gui-linux-windows:
    name: Build Desktop GUI (Linux & Windows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI & MinGW Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-mingw-w64 gcc libgl1-mesa-dev xorg-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libxxf86vm-dev libwayland-dev libxkbcommon-dev fonts-dejavu-core

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.3

      - name: Compile Linux and Windows GUI
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p gui-dist
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ ! "$TAG" =~ ^v ]]; then
            TAG="snapshot"
          fi

          echo "Building Linux amd64 GUI package..."
          fyne package -os linux -app-id com.inkanim.studio -name InkAnim -icon "$PWD/assets/icon.png" -src ./cmd/inkanim
          LINUX_PKG=$(find . -name "InkAnim.tar.xz" | head -n 1)
          test -n "$LINUX_PKG" || (echo "Linux package not found" && exit 1)
          mv "$LINUX_PKG" "gui-dist/InkAnim_${TAG}_linux_amd64.tar.xz"

          echo "Cross-compiling Windows amd64 GUI binary..."
          CC=x86_64-w64-mingw32-gcc CGO_ENABLED=1 GOOS=windows GOARCH=amd64 fyne package -os windows -app-id com.inkanim.studio -name InkAnim -icon "$PWD/assets/icon.png" -src ./cmd/inkanim
          WIN_EXE=$(find . -name "InkAnim.exe" | head -n 1)
          test -n "$WIN_EXE" || (echo "Windows exe not found" && exit 1)
          mv "$WIN_EXE" "gui-dist/InkAnim_${TAG}_windows_amd64.exe"

          echo "Packaging Linux amd64 Inkscape extension..."
          chmod +x ./build.sh
          TAG="$TAG" OUTPUT_DIR="$PWD/gui-dist" ./build.sh ext-linux

          echo "Cross-compiling Windows amd64 Inkscape extension..."
          TAG="$TAG" OUTPUT_DIR="$PWD/gui-dist" ./build.sh ext-win

      - name: Upload GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist-linux-windows
          path: gui-dist/

  build-gui-macos:
    name: Build Desktop GUI (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.3

      - name: Build macOS GUI
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p gui-dist
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ ! "$TAG" =~ ^v ]]; then
            TAG="snapshot"
          fi

          fyne package -os darwin -app-id com.inkanim.studio -name InkAnim -icon "$PWD/assets/icon.png" -src ./cmd/inkanim
          zip -r "gui-dist/InkAnim_${TAG}_darwin_all.zip" InkAnim.app

          echo "Building and packaging macOS Inkscape extension..."
          chmod +x ./build.sh
          TAG="$TAG" OUTPUT_DIR="$PWD/gui-dist" ./build.sh ext-darwin

      - name: Upload GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist-macos
          path: gui-dist/

  build-wasm:
    name: Build WebAssembly Studio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Package WebAssembly Studio
        run: |
          mkdir -p gui-dist
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ ! "$TAG" =~ ^v ]]; then
            TAG="snapshot"
          fi

          chmod +x ./build.sh
          ./build.sh wasm

          cd build/gh-pages/demo
          zip -r "../../../gui-dist/InkAnim_${TAG}_web.zip" .

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist-wasm
          path: gui-dist/

  release:
    name: Release Binaries (GoReleaser + Client)
    needs: [test, build-gui-linux-windows, build-gui-macos, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Verify Clean Git State
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "Dirty git state detected:" && git status && exit 1)

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --clean --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download GUI Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gui-dist-*
          path: gui-dist
          merge-multiple: true

      - name: Update and Consolidate Checksums
        run: |
          cd gui-dist
          sha256sum * >> ../dist/checksums.txt
          cd ..
          sort -k2 -o dist/checksums.txt dist/checksums.txt
          echo "=== Final Consolidated dist/checksums.txt ==="
          cat dist/checksums.txt

      - name: Attach GUI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} gui-dist/* dist/checksums.txt --clobber
