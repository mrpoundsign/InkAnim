name: Release InkAnim

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI Dependencies for Tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev

      - name: Run Full Test Suite
        run: go test -v ./internal/...

      - name: Validate GoReleaser Config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  build-gui:
    name: Build Desktop GUI (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Cache fyne-cross binary
        id: cache-fyne-cross
        uses: actions/cache@v4
        with:
          path: ~/go/bin/fyne-cross
          key: ${{ runner.os }}-fyne-cross-bin-v2

      - name: Install fyne-cross
        if: steps.cache-fyne-cross.outputs.cache-hit != 'true'
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Cache Docker image for fyne-cross ${{ matrix.target }}
        id: cache-docker-image
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache
          key: docker-fyne-cross-${{ matrix.target }}-1.7

      - name: Load cached Docker image
        if: steps.cache-docker-image.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-cache/image.tar

      - name: Pull Docker image if not cached
        if: steps.cache-docker-image.outputs.cache-hit != 'true'
        run: |
          docker pull fyneio/fyne-cross:1.7-${{ matrix.target }}
          mkdir -p /tmp/docker-cache
          docker save fyneio/fyne-cross:1.7-${{ matrix.target }} -o /tmp/docker-cache/image.tar

      - name: Cache fyne-cross build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/fyne-cross
          key: ${{ runner.os }}-fyne-cross-build-${{ matrix.target }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-fyne-cross-build-${{ matrix.target }}-

      - name: Cross-Compile Desktop GUI for ${{ matrix.target }}
        run: |
          ~/go/bin/fyne-cross ${{ matrix.target }} -arch=amd64,arm64 -app-id=com.inkanim.studio ./cmd/inkanim

      - name: Prepare GUI Packages
        run: |
          mkdir -p gui-dist
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [[ ! "$TAG" =~ ^v ]]; then
            TAG="latest"
          fi
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp fyne-cross/dist/windows-amd64/InkAnim.exe.zip "gui-dist/InkAnim_${TAG}_windows_amd64.zip"
            cp fyne-cross/dist/windows-arm64/InkAnim.exe.zip "gui-dist/InkAnim_${TAG}_windows_arm64.zip"
          elif [ "${{ matrix.target }}" = "linux" ]; then
            cp fyne-cross/dist/linux-amd64/InkAnim.tar.xz "gui-dist/InkAnim_${TAG}_linux_amd64.tar.xz"
            cp fyne-cross/dist/linux-arm64/InkAnim.tar.xz "gui-dist/InkAnim_${TAG}_linux_arm64.tar.xz"
          fi

      - name: Upload GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gui-dist-${{ matrix.target }}
          path: gui-dist/

  release:
    name: Release Binaries (GoReleaser + Unified Checksums)
    needs: [test, build-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Download GUI Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gui-dist-*
          path: gui-dist
          merge-multiple: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'release --clean --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Checksums and Attach GUI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gui-dist
          sha256sum * >> ../dist/checksums.txt
          cd ..
          sort -k2 -o dist/checksums.txt dist/checksums.txt
          gh release upload ${{ github.ref_name }} gui-dist/* dist/checksums.txt --clobber
