name: Deploy GitHub Pages Redirect

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Redirect Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Create Redirect Page
        run: |
          mkdir -p build/redirect
          cat << 'EOF' > build/redirect/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=https://inkanim.poundsigndesign.com/" />
              <title>InkAnim is moving...</title>
              <style>
                  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #0d1117; color: #c9d1d9; margin: 0; }
                  a { color: #58a6ff; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>InkAnim is moving!</h1>
              <p>We've migrated to a new high-performance WebAssembly host.</p>
              <p>If you are not redirected automatically, <a href="https://inkanim.poundsigndesign.com/">click here</a>.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/redirect

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
