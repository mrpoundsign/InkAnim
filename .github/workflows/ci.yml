name: CI Quality Gate

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'testdata/**'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'testdata/**'
      - '.golangci.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (golangci-lint-v2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Cache golangci-lint-v2 binary
        id: cache-golangci-lint-v2
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint-v2
          key: ${{ runner.os }}-golangci-lint-v2-2.13.2

      - name: Install golangci-lint-v2
        if: steps.cache-golangci-lint-v2.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          mv ~/go/bin/golangci-lint ~/go/bin/golangci-lint-v2

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev xorg-dev

      - name: Run golangci-lint-v2
        run: |
          golangci-lint-v2 run ./...

  test:
    name: Test Suite & Integration Rendering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Linux GUI & Font Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev \
            libxkbcommon-dev fonts-dejavu-core

      - name: Run Full Test Suite (Unit & Integration Fixtures)
        run: go test -v ./...
