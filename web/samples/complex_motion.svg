<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" version="1.1" id="svg_complex_motion_demo" xmlns:sodipodi-0.dtd="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" sodipodi-0.dtd:docname="complex_motion.svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" inkscape:version="1.4.4 (dcaf3e7, 2026-05-05)" xmlns:_xmlns="xmlns" _xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" _xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns="http://www.w3.org/2000/svg" _xmlns:svg="http://www.w3.org/2000/svg">
  <namedview xmlns="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" id="namedview26" pagecolor="#505050" bordercolor="#eeeeee" borderopacity="1" inkscape:showpageshadow="0" inkscape:pageopacity="0" inkscape:pagecheckerboard="0" inkscape:deskcolor="#505050" showgrid="false" inkscape:zoom="4.7382812" inkscape:cx="128" inkscape:cy="128" inkscape:window-width="2560" inkscape:window-height="1494" inkscape:window-x="-11" inkscape:window-y="-11" inkscape:window-maximized="1" inkscape:current-layer="stars_twinkle"></namedview>
  <defs xmlns="http://www.w3.org/2000/svg" id="defs3">
    <!-- Arrowhead markers for visual motion direction -->
    <marker xmlns="http://www.w3.org/2000/svg" id="arrow_gold" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path xmlns="http://www.w3.org/2000/svg" d="M 1 2 L 8 5 L 1 8 z" fill="#fbbf24" id="path1"></path>
    </marker>
    <marker xmlns="http://www.w3.org/2000/svg" id="arrow_purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path xmlns="http://www.w3.org/2000/svg" d="M 1 2 L 8 5 L 1 8 z" fill="#c084fc" id="path2"></path>
    </marker>
    <marker xmlns="http://www.w3.org/2000/svg" id="arrow_cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path xmlns="http://www.w3.org/2000/svg" d="M 1 2 L 8 5 L 1 8 z" fill="#38bdf8" id="path3"></path>
    </marker>
    <!-- Engine Flame Color Pulse Gradient (Yellow -> Orange -> Cyan) -->
    <linearGradient xmlns="http://www.w3.org/2000/svg" id="flame_pulse_grad">
      <stop xmlns="http://www.w3.org/2000/svg" offset="0%" stop-color="#fef08a"></stop>
      <stop xmlns="http://www.w3.org/2000/svg" offset="50%" stop-color="#f97316"></stop>
      <stop xmlns="http://www.w3.org/2000/svg" offset="100%" stop-color="#38bdf8"></stop>
    </linearGradient>
    <!-- Twinkling Stars Chromatic Shift Gradient (White -> Light Blue -> Soft Yellow) -->
    <linearGradient xmlns="http://www.w3.org/2000/svg" id="stars_twinkle_grad">
      <stop xmlns="http://www.w3.org/2000/svg" offset="0%" stop-color="#ffffff"></stop>
      <stop xmlns="http://www.w3.org/2000/svg" offset="50%" stop-color="#93c5fd"></stop>
      <stop xmlns="http://www.w3.org/2000/svg" offset="100%" stop-color="#fef08a"></stop>
    </linearGradient>
    <!-- Planetary Ring Specular Shimmer Gradient (Purple -> Bright Cyan Highlight -> Purple) -->
    <linearGradient xmlns="http://www.w3.org/2000/svg" id="ring_shimmer">
      <stop xmlns="http://www.w3.org/2000/svg" offset="0%" stop-color="#a78bfa"></stop>
      <stop xmlns="http://www.w3.org/2000/svg" offset="50%" stop-color="#22d3ee"></stop>
      <stop xmlns="http://www.w3.org/2000/svg" offset="100%" stop-color="#a78bfa"></stop>
    </linearGradient>
  </defs>
  <!-- Global Camera Trajectory: 320px right pan across top of scene (f: 1-60, ease: in-out) -->
  <path xmlns="http://www.w3.org/2000/svg" id="camera_pan" inkscape:label="Camera {f: 1-60; ease: in-out}" d="M 0,20 L 320,20" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrow_gold)"></path>
  <!-- Fixed Space Background Canvas -->
  <rect xmlns="http://www.w3.org/2000/svg" width="256" height="256" fill="#0f172a" id="space_bg"></rect>
  <!-- Twinkling Stars (smooth opacity cycle across 60 frames, subtle parallax factor 0.08) -->
  <g xmlns="http://www.w3.org/2000/svg" id="stars_twinkle" inkscape:groupmode="layer" inkscape:label="Twinkling Stars">
    <!-- Color Modifier: subtle background star color cycle across 60 frames -->
    
    <circle xmlns="http://www.w3.org/2000/svg" cx="28" cy="45" r="1.5" fill="#fef08a" id="circle3"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="55" cy="110" r="1.2" fill="#ffffff" id="circle4"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="115" cy="35" r="1.0" fill="#ffffff" id="circle5"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="140" cy="85" r="1.4" fill="#fef08a" id="circle6"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="175" cy="40" r="1.2" fill="#ffffff" id="circle7"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="210" cy="190" r="1.6" fill="#fef08a" id="circle8"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="235" cy="75" r="1.0" fill="#ffffff" id="circle9"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="70" cy="225" r="1.4" fill="#fef08a" id="circle10"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="160" cy="235" r="1.2" fill="#ffffff" id="circle11"></circle>
    
    <!-- Twinkle: fade down then back up -->
    
    
  </g>
  <!-- Rapid Blinking Star (5 Show bursts, parallax factor 0.15) -->
  <g xmlns="http://www.w3.org/2000/svg" id="star_blink" inkscape:groupmode="layer" inkscape:label="Blinking Star">
    <circle xmlns="http://www.w3.org/2000/svg" cx="180" cy="50" r="2.5" fill="#fef08a" id="circle12"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="45" cy="180" r="2.0" fill="#fef08a" id="circle13"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="130" cy="210" r="2.2" fill="#fef08a" id="circle14"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="225" cy="135" r="1.8" fill="#fde047" id="circle15"></circle>
    
    
    
    
    
    
  </g>
  <!-- Star that both Fades AND Blinks (parallax factor 0.12) -->
  <g xmlns="http://www.w3.org/2000/svg" id="star_fade_blink" inkscape:groupmode="layer" inkscape:label="Fade and Blink Star">
    <circle xmlns="http://www.w3.org/2000/svg" cx="90" cy="200" r="1.8" fill="#fef08a" id="circle16"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="80" cy="70" r="1.5" fill="#fef08a" id="circle17"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="205" cy="100" r="1.6" fill="#ffffff" id="circle18"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="150" cy="170" r="1.5" fill="#fef08a" id="circle19"></circle>
    
    <!-- Smooth fade-in over 60 frames combined with intermittent blinks -->
    
    
    
    
  </g>
  <!-- Center Planet with Stylized Ring: starts on right at x=256 (half off-screen), moves across to x=0 (Dist factor 0.8) -->
  <g xmlns="http://www.w3.org/2000/svg" id="group_planet" inkscape:groupmode="layer" inkscape:label="Center Planet">
    <!-- Midground Parallax factor 0.8 sweeps planet left across scene -->
    
    <!-- Tilted Planetary Ring (cx=256, cy=128): Back arc rendered behind planet -->
    <g xmlns="http://www.w3.org/2000/svg" id="group_ring_back" inkscape:label="Planetary Ring Back">
      
      <path xmlns="http://www.w3.org/2000/svg" id="ring_back" d="M 198,128 A 58,16 0 0,1 314,128" fill="none" stroke="#a78bfa" stroke-width="3" transform="rotate(-45 256 128)" opacity="0.75"></path>
    </g>
    <!-- Planet Sphere (Enlarged to r=38, placed at 256, 128) -->
    <circle xmlns="http://www.w3.org/2000/svg" cx="256" cy="128" r="38" fill="#7c3aed" stroke="#6d28d9" stroke-width="2.5" id="circle20"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="246" cy="118" r="28" fill="#8b5cf6" opacity="0.65" id="circle21"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="240" cy="110" r="6" fill="#c4b5fd" opacity="0.85" id="circle22"></circle>
    <!-- Planetary Ring: Front arc rendered over planet -->
    <g xmlns="http://www.w3.org/2000/svg" id="group_ring_front" inkscape:label="Planetary Ring Front">
      
      <path xmlns="http://www.w3.org/2000/svg" id="ring_front" d="M 314,128 A 58,16 0 0,1 198,128" fill="none" stroke="#a78bfa" stroke-width="3" transform="rotate(-45 256 128)" opacity="0.75"></path>
    </g>
  </g>
  <!-- Moon in 45-degree Elliptical Orbit: starts at (213.6, 85.6), tracks planet transit via Dist factor 0.8 -->
  <g xmlns="http://www.w3.org/2000/svg" id="group_moon" inkscape:groupmode="layer" inkscape:label="Orbiting Moon">
    <!-- Tracks planet drift via Dist factor 0.8 -->
    
    <!-- Moon Artwork placed at start point (213.6, 85.6) -->
    <circle xmlns="http://www.w3.org/2000/svg" cx="213.6" cy="85.6" r="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" id="circle23"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="212.3" cy="84.3" r="1.6" fill="#cbd5e1" id="circle24"></circle>
    <!-- 60-frame 45-degree Elliptical Orbit Path (thin dotted purple with direction arrow) -->
    
    <!-- Dynamic Depth: renders behind planet during back half, in front during front half -->
    
    
    <!-- Perspective Scaling: shrinks as it moves away behind planet, swells as it orbits toward us in foreground -->
    
    
    
    
  </g>
  <!-- Shuttle Group: 2x scaled spaceship moving across scene from left to right on its flight path (Dist factor 0.0) -->
  <g xmlns="http://www.w3.org/2000/svg" inkscape:groupmode="layer" id="group_shuttle" inkscape:label="Space Shuttle">
    <!-- Factor 0.0 ensures flight path translates purely left-to-right without being cancelled by camera pan -->
    
    <!-- Spaceship Artwork facing right (+X), enlarged 2x, green body for high contrast -->
    <polygon xmlns="http://www.w3.org/2000/svg" points="60,128 6,108 18,128 6,148" fill="#22c55e" stroke="#15803d" stroke-width="3" id="polygon24"></polygon>
    <!-- Pulsing Exhaust Flame (grows/shrinks and fades in/out repeatedly, enlarged 2x) -->
    <g xmlns="http://www.w3.org/2000/svg" id="engine_trail" inkscape:label="Engine Flame">
      <!-- Color Modifier: exhaust flames pulse between Yellow, Orange, Cyan in sync with scale pulses -->
      
      <polygon xmlns="http://www.w3.org/2000/svg" points="18,122 -6,128 18,134" fill="#f97316" id="polygon25"></polygon>
      <polygon xmlns="http://www.w3.org/2000/svg" points="18,124 4,128 18,132" fill="#fef08a" id="polygon26"></polygon>
      
      
      
      
      
      
      
      
    </g>
    <!-- Cockpit Window enlarged 2x -->
    <circle xmlns="http://www.w3.org/2000/svg" cx="38" cy="128" r="6" fill="#f8fafc" id="circle26"></circle>
    <!-- Motion 1: 60-frame flight across S-curve with auto-orientation (thin dotted cyan with direction arrow) -->
    
    <!-- Motion 2: 180 degree roll at top arc, hold inverted, 180 degree roll back at bottom arc -->
    
    
    
    <!-- Motion 3: Scale from distance into foreground (0.6x to 1.4x) -->
    
  </g>
  <!-- Document Color Swatches & Gradients (Off-canvas, does not cover scene artwork) -->
  <g xmlns="http://www.w3.org/2000/svg" id="color_swatches" inkscape:label="Color Swatches">
    <text xmlns="http://www.w3.org/2000/svg" x="10" y="276" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8">Color Swatches &amp; Shift Gradients:</text>
    <rect xmlns="http://www.w3.org/2000/svg" x="10" y="282" width="28" height="16" rx="3" fill="url(#ring_shimmer)" stroke="#64748b" stroke-width="0.8"></rect>
    <text xmlns="http://www.w3.org/2000/svg" x="44" y="294" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#cbd5e1">Ring Shimmer</text>
    <rect xmlns="http://www.w3.org/2000/svg" x="130" y="282" width="28" height="16" rx="3" fill="url(#flame_pulse_grad)" stroke="#64748b" stroke-width="0.8"></rect>
    <text xmlns="http://www.w3.org/2000/svg" x="164" y="294" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#cbd5e1">Flame Pulse</text>
    <rect xmlns="http://www.w3.org/2000/svg" x="240" y="282" width="28" height="16" rx="3" fill="url(#stars_twinkle_grad)" stroke="#64748b" stroke-width="0.8"></rect>
    <text xmlns="http://www.w3.org/2000/svg" x="274" y="294" font-family="DejaVu Sans, sans-serif" font-size="8" fill="#cbd5e1">Star Twinkle</text>
  </g>
</svg>
