<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" version="1.1" id="svg_pendulum_demo" xmlns:_xmlns="xmlns" _xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" _xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" xmlns="http://www.w3.org/2000/svg">
  <namedview xmlns="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" id="namedview_pendulum" pagecolor="#2e2e35" bordercolor="#666666" borderopacity="1.0" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" inkscape:showpageshadow="2" inkscape:pageopacity="0.0" inkscape:pagecheckerboard="0" inkscape:deskcolor="#1e1e24"></namedview>

  <!-- Stand / Pedestal Base -->
  <g xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" inkscape:groupmode="layer" id="layer_clock_stand" inkscape:label="Clock Stand" style="display:inline">
    <rect xmlns="http://www.w3.org/2000/svg" x="34" y="218" width="188" height="26" rx="5" ry="5" fill="#241B30" stroke="#46385E" stroke-width="2"></rect>
    <rect xmlns="http://www.w3.org/2000/svg" x="48" y="214" width="160" height="5" rx="2" ry="2" fill="#322642"></rect>
    <text xmlns="http://www.w3.org/2000/svg" x="128" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FCE082" text-anchor="middle" letter-spacing="1">PENDULUM</text>
    <!-- Stand Arched Frame -->
    <path xmlns="http://www.w3.org/2000/svg" d="M 64 220 L 64 80 Q 64 24 128 24 Q 192 24 192 80 L 192 220" fill="none" stroke="#3D2E52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
    <path xmlns="http://www.w3.org/2000/svg" d="M 64 220 L 64 80 Q 64 24 128 24 Q 192 24 192 80 L 192 220" fill="none" stroke="#604780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    <!-- Pivot Housing Anchor -->
    <circle xmlns="http://www.w3.org/2000/svg" cx="128" cy="44" r="14" fill="#241B30" stroke="#E5A93C" stroke-width="3" id="pivot_mount"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="128" cy="44" r="6" fill="#FCE082"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="128" cy="44" r="3" fill="#18181B"></circle>
  </g>

  <!-- Animated Pendulum Arm drawn at Leftmost Peak (-24 deg), rotating 48 deg cw across 10 frames to Right Peak -->
  <g xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" inkscape:groupmode="layer" id="layer_pendulum_arm" inkscape:label="Pendulum Arm" style="display:inline">
    <!-- Pendulum Rod (Left Peak) -->
    <line xmlns="http://www.w3.org/2000/svg" x1="128" y1="44" x2="73" y2="168" stroke="#E5A93C" stroke-width="5" stroke-linecap="round"></line>
    <line xmlns="http://www.w3.org/2000/svg" x1="128" y1="44" x2="73" y2="168" stroke="#FCE082" stroke-width="2" stroke-linecap="round"></line>
    <!-- Pendulum Bob (Left Peak) -->
    <circle xmlns="http://www.w3.org/2000/svg" cx="73" cy="168" r="22" fill="#E5A93C" stroke="#7A5310" stroke-width="2"></circle>
    <circle xmlns="http://www.w3.org/2000/svg" cx="73" cy="168" r="17" fill="#F5C252"></circle>
    <ellipse xmlns="http://www.w3.org/2000/svg" cx="66" cy="161" rx="6" ry="4" fill="#FFF2B8" opacity="0.85"></ellipse>

    <!-- IAMS Rot Guide: Swings 48 deg ccw from left peak to right peak around #pivot_mount -->
    
  </g>
</svg>
