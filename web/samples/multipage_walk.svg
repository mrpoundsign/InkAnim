<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="560"
   height="256"
   viewBox="0 0 560 256"
   version="1.1"
   id="svg_multipage_demo"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#2e2e35"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:deskcolor="#1e1e24">
    <!-- Page 1: 256x256 square at x=0 -->
    <inkscape:page x="0" y="0" width="256" height="256" id="page_step1" inkscape:label="Frame 1 - Neutral" />
    <!-- Page 2: 256x256 square at x=300 -->
    <inkscape:page x="300" y="0" width="256" height="256" id="page_step2" inkscape:label="Frame 2 - Jump" />
  </sodipodi:namedview>

  <!-- Content on Page 1 (Centered around x=128) -->
  <g id="page1_content" inkscape:groupmode="layer" inkscape:label="Frame 1 - Neutral">
    <ellipse cx="128" cy="225" rx="46" ry="12" fill="#202028" opacity="0.6" />
    <circle cx="128" cy="135" r="62" fill="#9146FF" />
    <circle cx="108" cy="126" r="11" fill="#FFFFFF" />
    <circle cx="110" cy="126" r="6" fill="#18181B" />
    <circle cx="148" cy="126" r="11" fill="#FFFFFF" />
    <circle cx="150" cy="126" r="6" fill="#18181B" />
    <ellipse cx="128" cy="158" rx="12" ry="7" fill="#18181B" />
  </g>

  <!-- Content on Page 2 (Centered around x=428) -->
  <g id="page2_content" inkscape:groupmode="layer" inkscape:label="Frame 2 - Jump">
    <ellipse cx="428" cy="230" rx="32" ry="8" fill="#202028" opacity="0.35" />
    <ellipse cx="428" cy="115" rx="54" ry="72" fill="#9146FF" />
    <circle cx="408" cy="104" r="13" fill="#FFFFFF" />
    <circle cx="410" cy="102" r="7" fill="#18181B" />
    <circle cx="448" cy="104" r="13" fill="#FFFFFF" />
    <circle cx="450" cy="102" r="7" fill="#18181B" />
    <ellipse cx="428" cy="142" rx="18" ry="14" fill="#FF4F9D" />
  </g>
</svg>
