<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   id="svg_bouncing_walker"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview_bounce"
     pagecolor="#2e2e35"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#1e1e24">
    <!-- Page 1: Standard 256x256 camera boundary -->
    <inkscape:page x="0" y="0" width="256" height="256" id="page_full" inkscape:label="Full Frame (256x256)" />
    <!-- Page 2: Close-up 160x160 camera artboard centered inside -->
    <inkscape:page x="48" y="32" width="160" height="160" id="page_focus" inkscape:label="Center Focus (160x160)" />
  </sodipodi:namedview>

  <!-- Background Layer (pinned) -->
  <g
     inkscape:groupmode="layer"
     id="layer_bg_grid"
     inkscape:label="Background Floor"
     style="display:inline">
    <!-- Subtle ground line -->
    <line x1="-50" y1="235" x2="306" y2="235" stroke="#383844" stroke-width="3" stroke-dasharray="8 8" />
  </g>

  <!-- Frame 1: Entering / Squash against Left Boundary (partially outside x < 0) -->
  <g
     inkscape:groupmode="layer"
     id="frame1_left_wall"
     inkscape:label="1. Left Impact (Cropped)"
     style="display:inline">
    <!-- Shadow -->
    <ellipse cx="20" cy="230" rx="42" ry="10" fill="#202028" opacity="0.6" />
    <!-- Squashed body against left wall (cx=20, rx=48 extends to x = -28) -->
    <ellipse cx="20" cy="170" rx="48" ry="40" fill="#772CE8" />
    <ellipse cx="25" cy="145" rx="12" ry="6" fill="#B37DFF" opacity="0.5" />
    <!-- Eyes looking right -->
    <circle cx="35" cy="160" r="10" fill="#FFFFFF" />
    <circle cx="38" cy="160" r="5" fill="#18181B" />
    <circle cx="55" cy="160" r="10" fill="#FFFFFF" />
    <circle cx="58" cy="160" r="5" fill="#18181B" />
    <!-- Excited impact smile -->
    <path d="M 32 182 Q 44 194 56 182" stroke="#18181B" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Frame 2: Rebound jump up-right -->
  <g
     inkscape:groupmode="layer"
     id="frame2_jump_up"
     inkscape:label="2. Rebound Jump"
     style="display:none">
    <ellipse cx="75" cy="230" rx="30" ry="7" fill="#202028" opacity="0.35" />
    <!-- Stretched body rising diagonally -->
    <ellipse cx="75" cy="130" rx="42" ry="62" fill="#9146FF" transform="rotate(15 75 130)" />
    <ellipse cx="68" cy="95" rx="12" ry="6" fill="#B37DFF" opacity="0.5" />
    <!-- Eyes -->
    <circle cx="70" cy="118" r="11" fill="#FFFFFF" />
    <circle cx="74" cy="116" r="6" fill="#18181B" />
    <circle cx="95" cy="122" r="11" fill="#FFFFFF" />
    <circle cx="99" cy="120" r="6" fill="#18181B" />
    <!-- Open smile -->
    <ellipse cx="85" cy="148" rx="14" ry="10" fill="#FF4F9D" />
  </g>

  <!-- Frame 3: Apex Peak in Center -->
  <g
     inkscape:groupmode="layer"
     id="frame3_apex"
     inkscape:label="3. Apex Jump (Center)"
     style="display:none">
    <ellipse cx="128" cy="232" rx="24" ry="6" fill="#202028" opacity="0.25" />
    <!-- Slime high at center -->
    <circle cx="128" cy="85" r="54" fill="#9146FF" />
    <ellipse cx="112" cy="55" rx="14" ry="7" fill="#B37DFF" opacity="0.5" />
    <!-- Happy eyes -->
    <path d="M 108 80 Q 118 70 128 80" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 138 80 Q 148 70 158 80" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" />
    <!-- Big joyful open mouth -->
    <ellipse cx="133" cy="104" rx="16" ry="12" fill="#FF4F9D" />
    <ellipse cx="133" cy="107" rx="9" ry="6" fill="#770030" />
  </g>

  <!-- Frame 4: Descending Stretch Right -->
  <g
     inkscape:groupmode="layer"
     id="frame4_descent"
     inkscape:label="4. Descent Right"
     style="display:none">
    <ellipse cx="180" cy="230" rx="34" ry="8" fill="#202028" opacity="0.4" />
    <ellipse cx="180" cy="140" rx="44" ry="64" fill="#9146FF" transform="rotate(-15 180 140)" />
    <ellipse cx="188" cy="105" rx="12" ry="6" fill="#B37DFF" opacity="0.5" />
    <!-- Eyes looking ahead right -->
    <circle cx="170" cy="130" r="11" fill="#FFFFFF" />
    <circle cx="175" cy="130" r="6" fill="#18181B" />
    <circle cx="196" cy="126" r="11" fill="#FFFFFF" />
    <circle cx="201" cy="126" r="6" fill="#18181B" />
    <!-- Focused mouth -->
    <ellipse cx="186" cy="158" rx="10" ry="6" fill="#18181B" />
  </g>

  <!-- Frame 5: Impact / Squash against Right Boundary (partially outside x > 256) -->
  <g
     inkscape:groupmode="layer"
     id="frame5_right_wall"
     inkscape:label="5. Right Impact (Cropped)"
     style="display:none">
    <!-- Shadow -->
    <ellipse cx="236" cy="230" rx="42" ry="10" fill="#202028" opacity="0.6" />
    <!-- Squashed body against right wall (cx=236, rx=48 extends to x = 284) -->
    <ellipse cx="236" cy="170" rx="48" ry="40" fill="#772CE8" />
    <ellipse cx="225" cy="145" rx="12" ry="6" fill="#B37DFF" opacity="0.5" />
    <!-- Eyes looking left/startled -->
    <circle cx="205" cy="160" r="10" fill="#FFFFFF" />
    <circle cx="202" cy="160" r="5" fill="#18181B" />
    <circle cx="225" cy="160" r="10" fill="#FFFFFF" />
    <circle cx="222" cy="160" r="5" fill="#18181B" />
    <!-- Impact smile -->
    <path d="M 206 182 Q 218 194 230 182" stroke="#18181B" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Frame 6: Rebound Jump back to Center -->
  <g
     inkscape:groupmode="layer"
     id="frame6_rebound"
     inkscape:label="6. Return Jump"
     style="display:none">
    <ellipse cx="160" cy="228" rx="34" ry="8" fill="#202028" opacity="0.45" />
    <ellipse cx="160" cy="135" rx="46" ry="60" fill="#9146FF" transform="rotate(-10 160 135)" />
    <ellipse cx="152" cy="100" rx="12" ry="6" fill="#B37DFF" opacity="0.5" />
    <!-- Eyes looking left -->
    <circle cx="145" cy="125" r="11" fill="#FFFFFF" />
    <circle cx="142" cy="125" r="6" fill="#18181B" />
    <circle cx="170" cy="125" r="11" fill="#FFFFFF" />
    <circle cx="167" cy="125" r="6" fill="#18181B" />
    <!-- Grin -->
    <ellipse cx="156" cy="152" rx="12" ry="8" fill="#FF4F9D" />
  </g>
</svg>
